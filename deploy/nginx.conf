worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # Only hashed build assets and pinned AI models get immutable caching.
    # HTML, route payloads and sw.js revalidate so deployments become visible.
    # Missing assets must not be cached as immutable error pages.
    map "$status:$uri" $cache_control {
        default "no-cache";
        ~^(200|206|304):/_next/static/ "public, max-age=31536000, immutable";
        ~^(200|206|304):/models/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        # Keep redirects relative so Coolify's HTTPS proxy preserves its public
        # scheme and domain, without exposing the internal container port.
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        # Generated from public/_headers during the Docker build.
        include /etc/nginx/social9-headers.conf;
        add_header Cache-Control $cache_control always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_headers {
            return 404;
        }

        location / {
            rewrite ^/(.+)/$ /$1 permanent;
            # HTML comes first: Next exports route payload directories alongside
            # editor.html and platforms/instagram.html. Serve the page directly.
            try_files $uri.html $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
